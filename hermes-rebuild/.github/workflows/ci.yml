name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned tooling
        run: |
          python -m pip install uv==0.12.9
          npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: |
          uv sync --project apps/api --frozen
          pnpm install --frozen-lockfile
          pnpm --dir apps/web install --frozen-lockfile
      - name: Verify backend and contracts
        run: |
          uv run --project apps/api --frozen pytest apps/api/tests
          uv run --project apps/api --frozen ruff check apps/api/src apps/api/tests
          pnpm contracts:check
      - name: Verify frontend
        run: |
          pnpm typecheck:web
          pnpm test:web
          pnpm build:web
