[project]
name = "hermes-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "argon2-cffi>=23,<26", "psycopg[binary]>=3.2,<4", "tzdata>=2025.1", "pillow>=11,<13", "pypdf>=5,<7", "pypdfium2>=4.30,<6", "boto3>=1.37,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.extend-per-file-ignores]
"src/hermes_api/main.py" = ["B008"] # FastAPI dependency declarations.
"src/hermes_api/feedback_routes.py" = ["B008"] # FastAPI dependency declarations.
"src/hermes_api/knowledge_routes.py" = ["B008"] # FastAPI dependency declarations.
"src/hermes_api/attachment_routes.py" = ["B008"] # FastAPI dependency declarations.
"src/hermes_api/attachment_validation.py" = ["BLE001"] # Parser failures are collapsed to stable public codes in a subprocess.
"src/hermes_api/attachment_worker.py" = ["BLE001"] # Child process emits only a stable parser error code.
"src/hermes_api/attachment_repository.py" = ["BLE001"] # Durable jobs persist controlled public failure codes.
