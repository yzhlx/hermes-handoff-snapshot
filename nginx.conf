# Cloud Hermes Core V1 — reverse proxy (TLS termination on 443, app on loopback:8080).
# DB and local Windows service are NEVER exposed publicly.
server {
    listen 443 ssl http2;
    server_name staging-hermes.example.com;   # set to your staging domain

    ssl_certificate     /etc/ssl/hermes/fullchain.pem;
    ssl_certificate_key /etc/ssl/hermes/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;

    # The cloud API + same-origin web UI are served from this origin.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Block any direct access to the app port from outside (defense in depth).
    # (Cloud firewall should also restrict 8080 to localhost only.)
}

server {
    listen 80;
    server_name staging-hermes.example.com;
    return 301 https://$host$request_uri;
}
